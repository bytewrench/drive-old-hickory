server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip the big Int16 terrain rasters and the JS bundle on the wire.
  gzip on;
  gzip_types application/javascript application/octet-stream application/wasm text/css image/svg+xml;
  gzip_min_length 1024;

  # The .bin terrain rasters and the wasm are content-hashed at build time by
  # Vite (except the two /public bins) — cache the hashed assets hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The terrain binaries live at the web root; cache but allow revalidation.
  location ~ \.(bin|wasm)$ {
    expires 7d;
    add_header Cache-Control "public";
  }

  # Single-page app: fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
